<!--
  「About me.」的手寫字，從 Figma 匯出的原檔。要換成新的：在 Figma 選起那行字 →
  Export as SVG，直接覆蓋這個檔案就好，不用動任何一行程式。

  這個檔案有兩個硬性要求，DrawSVG 才畫得出來：

  1. 必須是「有 stroke 的開放路徑」（Figma 的鉛筆／向量筆畫），不是 outline 過的
     填色形狀。Outline 過的字，DrawSVG 會沿著字的「輪廓」跑一圈，看起來像描邊而
     不是書寫。在 Figma 裡不要對它按 Outline Stroke。
  2. <path> 在檔案裡的順序 = 落筆的順序。想改筆序就改這裡的順序。

  顏色由 CSS 的 --accent 接管（見 index.css），所以 stroke 值不用管；
  stroke-width 與筆帽沿用這裡的設定，你在 Figma 調的粗細會被原樣尊重。

  跟匯出檔唯一的差別：t 的直畫與橫畫對調過。Figma 是照圖層順序吐出來的，
  先橫後直 —— 寫起來會是「先劃一橫再插一豎」，不是人寫字的樣子。
-->
